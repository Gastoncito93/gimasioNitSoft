<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="nStrokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d946ef" />
      <stop offset="35%" stop-color="#3b82f6" />
      <stop offset="70%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="innerN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="100" height="100" rx="22" fill="#050814" />

  <g filter="url(#glow)">
    <!-- Circuit Dot at Bottom Left -->
    <circle cx="28" cy="74" r="5" fill="#d946ef" stroke="#c026d3" stroke-width="2" />
    
    <!-- Outer Circuit Line going up, across, and down into N -->
    <path d="M 28 69 L 28 24 Q 28 16 36 16 L 70 16 Q 78 16 78 24 L 78 70 Q 78 78 70 78 L 50 78 Q 42 78 42 70" 
          fill="none" stroke="url(#nStrokeGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Inner Diagonal & Vertical N Segment -->
    <path d="M 42 42 L 58 26 L 58 54 L 42 70" 
          fill="none" stroke="url(#innerN)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>